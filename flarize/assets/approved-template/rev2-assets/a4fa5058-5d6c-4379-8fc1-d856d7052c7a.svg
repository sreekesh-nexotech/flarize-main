<?xml version="1.0" encoding="UTF-8"?>
<!--
  Rev2 brand logo asset.
  Purpose: replaces the v1 logo asset `592e2a11-eb93-4c2d-95a2-de3318e995eb`
  which carried the OLD legacy tagline. This asset carries
  the C7-locked brand + parent line only. No customer-specific data. No
  mustache tokens. No forbidden legacy strings.
  Consumer: `<image-slot id="co-brand-logo">` — footer of Page 5 HTML shell
  (see Rev D §8).
  Aspect: 236 × 88 pt (~2.68:1) — Rev D §8 specifies 118 × auto at render
  time.
-->
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 236 88"
     width="236" height="88">
  <title>Flarize — Backed by Golden Ray (Rev2 brand mark)</title>
  <defs>
    <style>
      .brand-wordmark { font-family: 'Poppins', -apple-system, BlinkMacSystemFont, sans-serif; font-weight: 700; }
      .brand-tagline  { font-family: 'Poppins', -apple-system, BlinkMacSystemFont, sans-serif; font-weight: 600; letter-spacing: 1.4px; }
    </style>
  </defs>
  <!-- Sun icon (orange) -->
  <g transform="translate(6 12)">
    <circle cx="26" cy="26" r="10" fill="#F5901E"/>
    <g stroke="#F5901E" stroke-width="3.2" stroke-linecap="round">
      <line x1="26" y1="4"  x2="26" y2="10"/>
      <line x1="26" y1="42" x2="26" y2="48"/>
      <line x1="4"  y1="26" x2="10" y2="26"/>
      <line x1="42" y1="26" x2="48" y2="26"/>
      <line x1="10.5" y1="10.5" x2="14.8" y2="14.8"/>
      <line x1="37.2" y1="37.2" x2="41.5" y2="41.5"/>
      <line x1="10.5" y1="41.5" x2="14.8" y2="37.2"/>
      <line x1="37.2" y1="14.8" x2="41.5" y2="10.5"/>
    </g>
  </g>
  <!-- Wordmark: FLARIZE -->
  <text x="66" y="46"
        class="brand-wordmark"
        font-size="32"
        fill="#123f35"
        letter-spacing="0.6">FLARIZE</text>
  <!-- Parent line: Backed by Golden Ray -->
  <text x="66" y="66"
        class="brand-tagline"
        font-size="9"
        fill="#5b656a">BACKED BY GOLDEN RAY</text>
</svg>
